# Chassis LED - K1C 2025 (X2600E main MCU, GPIO PA8)
# Exposes SET_LED LED=lighting WHITE=<0.0-1.0> to Klipper.
# Fluidd shows a "Lights" slider and a TOGGLE_LED macro button.
# The touchscreen LED control also works.
[led lighting]
white_pin: PA8
initial_WHITE: 1.0

[gcode_macro TOGGLE_LED]
gcode:
    {% if printer["led lighting"].color_data[0][3] > 0 %}
        SET_LED LED=lighting WHITE=0.0
    {% else %}
        SET_LED LED=lighting WHITE=1.0
    {% endif %}
